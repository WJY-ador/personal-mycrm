<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드</title>
<script src="{{asset:theme.js}}"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" referrerpolicy="no-referrer">
<!--{{ui}}-->
</head>
<body>
<header class="mast"><div class="wrap">
  <h1 id="date"></h1><span class="sub">대시보드 — 여기서는 보기·결정·내 글 고치기</span>
  <div class="axiswrap" id="ui-mast"></div>
  <div class="who"><details class="acct" id="acct"><summary><span class="sr">계정 메뉴 </span><span id="who"></span><span class="caret" aria-hidden="true">▾</span></summary>
    <div class="acct-menu" id="acct-menu">
      <!--admin--><a class="btn" href="/admin" id="acct-console" hidden>운영 콘솔</a>
      <hr><!--/admin-->
      <!--user--><p class="acct-group" id="acct-help-h" hidden>문의 및 개인정보</p>
      <button type="button" class="acct-sub" data-acct="send" aria-haspopup="dialog">문의 보내기</button>
      <button type="button" class="acct-sub" data-acct="mine" aria-haspopup="dialog">내 문의</button>
      <button type="button" class="acct-sub" data-acct="privacy" aria-haspopup="dialog">개인정보 요청</button>
      <hr>
      <button type="button" data-acct="names" id="acct-names" aria-pressed="false" hidden>구조 이름 공유 <span class="st" id="acct-names-st">꺼짐</span></button>
      <p class="acct-note" hidden>안 해도 모든 기능을 써요. <a href="/privacy#privacy-1">무엇을 보나요</a></p>
      <hr><!--/user-->
      <button type="button" data-acct="name" id="acct-name" aria-haspopup="dialog">표시 이름 바꾸기</button>
      <button type="button" data-acct="settings" id="acct-settings" hidden>내 구조 설정</button>
      <button type="button" data-acct="inbox" id="acct-inbox" hidden>저장 승인 대기<span class="st" id="acct-inbox-n"></span></button>
      <button type="button" data-acct="devices" id="acct-devices" hidden>연결 장치</button>
      <hr>
      <button type="button" data-acct="logout" id="logout">로그아웃</button>
      <p class="acct-msg" id="acct-msg" role="status"></p>
    </div></details><button class="refresh" id="reload" title="불러온 시각이 아래에 있어요">새로 고침</button><a class="refresh setup-gear" id="setup-link" href="#_setup" title="설정" aria-label="설정">⚙</a><button type="button" class="refresh theme-toggle" data-theme-toggle hidden aria-pressed="false" aria-label="어두운 화면">☾</button></div>
</div></header>
<nav class="tabs" id="nav" aria-label="내 탭"><div class="wrap"><span class="navslot" id="nav-tabs"></span><span class="navslot" id="ui-chatnav"></span></div></nav>
<div id="ui-chatnote"></div>
<nav class="subtabs" id="subnav" hidden></nav>
<div class="wrap bands" id="bands"></div>
<main id="view" class="wrap"><p class="hint" id="boot">불러오는 중이에요…</p></main>
<footer class="wrap foot"><span id="foot"></span> · <a href="/help">도움말</a> · <a href="/privacy">개인정보 처리방침</a></footer>
<!--user--><div id="ui-desk"></div><!--/user-->
</body>
</html>
