<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드</title>
<script src="{{asset:theme.js}}"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" referrerpolicy="no-referrer">
<style>
/* 「보드」 — 로컬 보드(checkpoint_board)·360·지도 칸반 구조를 옮긴 넓은 화면. 주색(--accent)은 조작·확정에만.
   형광펜(--mark)은 근거 구절과 그 인용에만. 상태색: 내 판단 --mine · 아직 안 정함 --warn · AI --ai · 메모 --memo. */
:root {
  color-scheme: light;
  --paper: #F7F8F6; --card: #FFFFFF; --ink: #1F2937; --muted: #6B7280; --soft: #9CA3AF; --line: #E3E5E1;
  --accent: #186A4B; --on-accent: #FFFFFF; --accent-soft: #EAF3EE;
  --warn: #B05C2A; --warn-bg: #FAF6F0;
  --ai: #5B4FB5; --ai-bg: #F1EFFA; --cand-bg: #FBFBFD; --cand-line: #D9D6EE;
  --memo: #6B7280; --memo-bg: #F3F4F6; --mine: #186A4B; --mine-bg: #EAF3EE; --fail: #B42318; --fail-bg: #FEF3F2;
  --mark: #FFE98A; --mark-ink: #1F2937; --shadow: none; --paper-border: 1px solid var(--line);
  --serif: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
  --mono: ui-monospace, Menlo, "Apple SD Gothic Neo", monospace;
}
/* 어두운 화면 — 헤더 ☀/☾ 토글(/assets/theme.js)이 켤 때만. OS 다크 설정은 따르지 않는다(기본은 밝은 화면). */
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #15181A; --card: #1E2224; --ink: #E7EAE6; --muted: #A3AAA6; --soft: #6F7773; --line: #2E3335;
  --accent: #4FB08A; --on-accent: #0F1412; --accent-soft: #1C2E26; --warn: #D99A6C; --warn-bg: #2B241D;
  --ai: #A79BE8; --ai-bg: #272437; --cand-bg: #202029; --cand-line: #3B3850; --memo: #A3AAA6; --memo-bg: #262A2C;
  --mine: #4FB08A; --mine-bg: #1C2E26; --fail: #F08A7E; --fail-bg: #33201E; --mark: #6E5A1A; --mark-ink: #E7EAE6;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); overflow-wrap: anywhere; word-break: keep-all;
  font: 14px/1.55 "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 1.4rem; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* 버튼 — 보드 .refresh 결: 1px 보더 · 6px · .8rem. primary 만 주색 바탕 */
button, .btn { font: inherit; font-size: .8rem; font-weight: 500; min-height: 32px; padding: .3rem .8rem; border-radius: 6px; cursor: pointer;
  background: var(--card); color: var(--ink); border: 1px solid var(--line); display: inline-flex; align-items: center;
  justify-content: center; gap: .35rem; text-decoration: none; white-space: nowrap; transition: border-color .12s, background .12s, color .12s; }
button:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
button.primary, .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
button.primary:hover, .btn.primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); color: var(--on-accent); }
button.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
button.small, button.tertiary { background: transparent; border-color: transparent; color: var(--accent); }
button.small:hover, button.tertiary:hover { background: var(--accent-soft); border-color: transparent; }
button:disabled, button:disabled:hover { cursor: default; opacity: .45; background: var(--card); color: var(--ink); border-color: var(--line); }
button.primary:disabled { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button.tertiary:disabled, button.tertiary:disabled:hover { background: transparent; border-color: transparent; color: var(--accent); }
a.link { color: var(--accent); font-size: .82rem; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* 마스트 — 세리프 날짜 · 한 줄 설명 · 오늘 스펙트럼 · 질문 레전드 */
.mast { border-bottom: 1px solid var(--line); }
.mast .wrap { display: flex; align-items: baseline; gap: .5rem 1.2rem; padding-top: 1.1rem; padding-bottom: .7rem; flex-wrap: wrap; }
.mast h1 { font-family: var(--serif); font-weight: 500; font-size: 1.65rem; letter-spacing: -.01em; margin: 0; line-height: 1.25; }
.mast .sub { color: var(--muted); font-size: .8rem; }
.axiswrap { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: .3rem; align-self: center; }
.axistop { display: flex; align-items: center; gap: .6rem; }
.speclabel { font-family: var(--mono); font-size: .68rem; color: var(--muted); font-weight: 500; }
.spectrum { flex: 1; min-width: 200px; display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); }
.spectrum div { height: 100%; }
.axistop { align-items: flex-start; }
.axistop > .speclabel { line-height: 10px; }
.specbox { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: .25rem; }
.specbox .spectrum { flex: none; min-width: 0; }
.speckey { display: flex; flex-wrap: wrap; gap: .1rem .8rem; font-size: .68rem; color: var(--muted); }
.speckey span { display: inline-flex; align-items: center; gap: .28rem; white-space: nowrap; }
.speckey i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--muted) 35%, transparent); }
.axislegend { display: flex; flex-wrap: wrap; gap: .15rem .9rem; font-size: .68rem; color: var(--muted); }
.axislegend .ax { display: inline-flex; align-items: center; gap: .28rem; white-space: nowrap; max-width: 100%; }
.axislegend .ax > span { overflow: hidden; text-overflow: ellipsis; }
.axislegend b { color: var(--ink); font-weight: 600; font-family: var(--mono); font-size: .66rem; }
.axislegend em { font-style: normal; font-family: var(--mono); }
.axislegend em.on { color: var(--warn); }
button.axpage { margin-left: .2rem; font-size: .62rem; padding: 0 .35rem; min-height: 0; line-height: 1.4; border: 1px solid var(--line);
  border-radius: .3rem; background: var(--card); color: var(--accent); font-weight: 500; }
button.axpage:hover { background: var(--accent-soft); }
.who { display: flex; align-items: center; gap: .4rem; align-self: center; font-size: .72rem; color: var(--muted); }
button.refresh { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: .15rem .5rem; min-height: 0;
  font-size: .72rem; color: var(--muted); font-weight: 500; }
button.refresh:hover { border-color: var(--accent); color: var(--accent); }
button.theme-toggle { min-width: 28px; justify-content: center; font-size: .82rem; }
a.setup-gear { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; min-height: 32px; flex-shrink: 0; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: .15rem .5rem;
  font-size: .9rem; color: var(--muted); font-weight: 500; text-decoration: none; line-height: 1.25; }
a.setup-gear[hidden] { display: none; }
a.setup-gear:hover { border-color: var(--accent); color: var(--accent); }
/* 계정 메뉴(P5) — 헤더 오른쪽 이메일 자리. 긴 이메일은 말줄임(전체는 title), 펼친 메뉴는 헤더 높이를 바꾸지 않는다 */
.who { min-width: 0; max-width: 100%; }
.acct { position: relative; min-width: 0; flex: 0 1 auto; }
.acct > summary { list-style: none; display: flex; align-items: center; gap: .3rem; min-width: 0; max-width: 100%; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: .15rem .5rem; font-size: .72rem; color: var(--muted); font-weight: 500; line-height: 1.55; }
.acct > summary::-webkit-details-marker { display: none; }
.acct > summary:hover, .acct[open] > summary { border-color: var(--accent); color: var(--accent); }
#who { display: block; min-width: 0; max-width: 9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (min-width: 1240px) { #who { max-width: 16rem; } }   /* 1100px 에서 날짜·설명·오늘 줄과 한 줄을 지키는 폭 */
@media (max-width: 700px) { #who { max-width: 18rem; } }   /* 좁은 화면은 .who 가 제 줄 — 남는 폭까지 */
.acct .caret { flex: none; font-size: .62rem; }
.acct-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; width: max-content; min-width: 13rem; max-width: calc(100vw - 2rem);
  display: flex; flex-direction: column; gap: .1rem; padding: .3rem; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--ink) 14%, transparent); }
.acct-menu button, .acct-menu a.btn { justify-content: space-between; width: 100%; border-color: transparent; background: transparent; font-size: .8rem; color: var(--ink); }
.acct-menu a.btn { display: flex; align-items: center; text-decoration: none; }   /* 관리자 「운영 콘솔」 — 링크를 메뉴 버튼과 같은 모양으로 */
.acct-menu button:hover, .acct-menu a.btn:hover { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.acct-menu .st { font-size: .72rem; color: var(--muted); font-weight: 600; }
.acct-menu button[aria-pressed="true"] .st { color: var(--accent); }
.acct-menu hr { border: 0; border-top: 1px solid var(--line); margin: .2rem 0; }
.acct-note { margin: -.1rem .8rem .25rem; font-size: .7rem; color: var(--muted); }
.acct-msg { margin: .2rem .8rem; font-size: .72rem; color: var(--fail); }
/* 계정 메뉴 — 표시 이름 바꾸기 · 저장 승인 대기 (N) · 문의 및 개인정보(세 이름 바로) · 로그아웃. order 로 줄을 세우고 구분선(hr)은 숨긴다.
   이름 입력 화면(navnew 클래스 없음)은 마크업 순서 그대로 */
.acct-menu.navnew > hr { display: none; }
.acct-menu.navnew > #acct-name { order: 1; } .acct-menu.navnew > #acct-settings { order: 2; }
.acct-menu.navnew > #acct-inbox { order: 3; } .acct-menu.navnew > #acct-devices { order: 4; }
.acct-menu.navnew > #acct-help-h { order: 5; } .acct-menu.navnew > .acct-sub { order: 6; padding-left: 1.4rem; }
.acct-menu.navnew > #logout { order: 8; } .acct-menu.navnew > #acct-msg { order: 9; }
.acct-group { margin: .2rem 0 0; padding: .35rem .8rem .1rem; border-top: 1px solid var(--line); font-size: .72rem; font-weight: 600; color: var(--muted); }
.acct-menu.navnew > #logout { border-top: 1px solid var(--line); border-radius: 0 0 6px 6px; margin-top: .2rem; }
.acct-msg:empty { display: none; }

/* 탭(종이 위 탭) · 서브 필 */
nav.tabs { border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: .2rem; padding-top: .5rem; }
.tab { border: 1px solid var(--line); border-bottom: none; background: transparent; color: var(--muted); font-size: .8rem;
  padding: .35rem .9rem; border-radius: 7px 7px 0 0; text-decoration: none; display: inline-flex; align-items: center; gap: .35rem;
  margin-bottom: -1px; border-bottom: 1px solid transparent; }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--card); color: var(--ink); font-weight: 600; border-bottom-color: var(--card); }
.tab .n { font-family: var(--mono); font-size: .68rem; font-weight: 600; color: var(--muted); }
.tab.on .n { color: var(--accent); }
.tab.maplink { margin-left: auto; }
nav.subtabs .wrap { display: flex; gap: .3rem; flex-wrap: wrap; padding-top: .9rem; }
nav.subtabs a { border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .78rem; padding: .25rem .7rem;
  border-radius: 999px; text-decoration: none; display: inline-flex; align-items: center; gap: .35rem; max-width: 100%; }
nav.subtabs a:hover { color: var(--ink); }
nav.subtabs a.on { background: var(--card); color: var(--ink); font-weight: 600; border-color: var(--ink); }
nav.subtabs a .n { font-family: var(--mono); font-size: .68rem; color: var(--warn); }
nav.subtabs a .n.m { color: var(--muted); }

/* 띠 — 화면 전체에 걸리는 것만 */
.bands { padding-top: .9rem; }
.bands:empty { padding-top: 0; }
.band { padding: .6rem .9rem; border-radius: 8px; margin-bottom: .6rem; font-size: .82rem; background: var(--card); border: 1px solid var(--line); }
.band.fail { background: var(--fail-bg); border-color: color-mix(in srgb, var(--fail) 30%, transparent); }

main#view { padding-top: 1rem; padding-bottom: 1.5rem; }

/* 판 — 흰 카드 한 장 */
.paper { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; }
.sheet { max-width: 900px; }
.eyebrow { display: flex; align-items: center; gap: .5rem; font-size: .74rem; color: var(--muted); letter-spacing: .02em; }
h2.title { font-size: 1.35rem; line-height: 1.35; margin: .3rem 0 .9rem; letter-spacing: -.01em; font-weight: 700; }
h2.sh { display: flex; align-items: center; gap: .5rem; font-size: .82rem; font-weight: 600; letter-spacing: .02em; margin: 0 0 .6rem; color: var(--ink); }
h2.sh ~ h2.sh, .cards + h2.sh, .empty + h2.sh, .nextline + h2.sh { margin-top: 1.4rem; }
.nextline { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; padding: .6rem .85rem; border-radius: 8px;
  background: var(--accent-soft); font-size: .84rem; margin-bottom: 1.2rem; }
.nextline .lbl { font-size: .74rem; color: var(--accent); font-weight: 700; flex: none; }
.nextline .txt { flex: 1 1 240px; min-width: 0; }
.nextline details { flex-basis: 100%; font-size: .8rem; color: var(--muted); }
.say { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-top: .3rem; color: var(--ink); }

section.sec { margin-top: 1.4rem; }
section.sec:first-child { margin-top: 0; }
.sechead { display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; margin-bottom: .6rem; }
.sechead h3, section.sec > h3 { font-size: .78rem; margin: 0 0 .6rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.sechead h3 { margin: 0; }
.count { color: var(--muted); font-weight: 500; margin-left: .35rem; font-family: var(--mono); font-size: .9em; }
.hint { color: var(--muted); font-size: .8rem; margin: -.2rem 0 .6rem; }
.empty { color: var(--muted); font-size: .84rem; padding: .7rem .9rem; border-radius: 8px; background: var(--paper); border: 1px dashed var(--line); }

/* 판단·문장 카드 */
.cards { display: flex; flex-direction: column; gap: .5rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .7rem .85rem; }
.card.mine { border-left: 3px solid var(--mine); }
.card.cand { border: 1px dashed var(--cand-line); background: var(--cand-bg); }
.card .sent { margin: 0 0 .4rem; font-size: .92rem; line-height: 1.5; font-weight: 500; }
.card.mine .sent { font-weight: 600; }
.labels { display: flex; gap: .3rem; flex-wrap: wrap; align-items: center; margin-bottom: .35rem; }
.badge { display: inline-flex; align-items: center; gap: .3rem; font-size: .7rem; font-weight: 600; padding: .05rem .45rem; border-radius: 4px; line-height: 1.6; }
.badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
.b-ai { color: var(--ai); background: var(--ai-bg); }
.b-memo { color: var(--memo); background: var(--memo-bg); }
.b-mine { color: var(--mine); background: var(--mine-bg); }
.b-wait { color: var(--warn); background: var(--warn-bg); border: 1px dashed color-mix(in srgb, var(--warn) 45%, transparent); }
.b-wait::before { background: transparent; border: 1.5px solid currentColor; width: 4px; height: 4px; }
.b-off { color: var(--muted); background: var(--memo-bg); }
.b-off::before { display: none; }
.b-warn { color: var(--warn); background: var(--warn-bg); }
.b-fail { color: var(--fail); background: var(--fail-bg); }
.chip { font-family: var(--mono); font-size: .66rem; letter-spacing: .04em; border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent);
  border-radius: 3px; padding: .05rem .35rem; color: var(--muted); white-space: nowrap; line-height: 1.5; }
.chip.flag { border-color: color-mix(in srgb, var(--warn) 50%, transparent); color: var(--warn); background: var(--warn-bg); }
.chip.st-mine { border-color: color-mix(in srgb, var(--mine) 45%, transparent); color: var(--mine); background: var(--mine-bg); }
.chip.st-wait { border-style: dashed; border-color: color-mix(in srgb, var(--warn) 50%, transparent); color: var(--warn); }
.chip.st-off { color: var(--soft); }
.chip.o-ai { color: var(--ai); border-color: color-mix(in srgb, var(--ai) 40%, transparent); }
.ev { font-size: .78rem; color: var(--muted); line-height: 1.55; }
.ev a { cursor: pointer; text-decoration: none; font-weight: 600; }
.ev q { quotes: "“" "”"; }
.cta { display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; margin: .8rem 0 .2rem; }
.cta .hint { margin: 0; }

/* 2열 보드(기록형 탭) */
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 1rem; align-items: start; }
.board > * { min-width: 0; }
.rside { position: sticky; top: .8rem; align-self: start; max-height: calc(100vh - 1.6rem); overflow: auto; }

/* 기록 목록 — 날짜 큰 숫자 */
.recs { list-style: none; margin: 0; padding: 0; }
.recbox { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .2rem .8rem; }
.recs li { border-top: 1px solid var(--line); }
.recs li:first-child { border-top: 0; }
.recs a { display: grid; grid-template-columns: 40px 1fr; gap: .7rem; align-items: start; padding: .55rem .2rem; color: var(--ink); text-decoration: none; cursor: pointer; border-radius: 6px; }
.recs a:hover { background: var(--paper); }
.recs .d { font-family: var(--serif); font-size: 1.3rem; font-weight: 500; line-height: 1.1; }
.recs .d small { display: block; font-family: var(--mono); font-size: .62rem; color: var(--soft); font-weight: 500; letter-spacing: .04em; }
.recs .t { font-size: .86rem; font-weight: 600; line-height: 1.45; }
.recs .s { font-size: .74rem; color: var(--muted); }
.recs a.on .t { color: var(--accent); }

details > summary { cursor: pointer; color: var(--muted); font-size: .8rem; min-height: 28px; padding: .2rem 0; }
details.fold { margin-top: 1rem; }
.partfail { background: var(--fail-bg); border-radius: 8px; padding: .6rem .85rem; font-size: .82rem; }
.partfail b { color: var(--fail); }
.partfail p { margin: .2rem 0; }
.tech { font-size: .72rem; color: var(--soft); }
.tech code { font-size: .72rem; }
code { font-family: var(--mono); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: .78rem; overflow-wrap: anywhere; }
.runs { margin-top: 1.4rem; font-size: .82rem; }

/* 첫 실행 */
.first h2 { font-size: 1.25rem; margin: 0 0 .3rem; font-weight: 700; }
.first > p { color: var(--muted); margin: 0 0 1rem; }
.steps { list-style: none; padding: 0; margin: 0 0 1rem; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
.steps li { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .7rem; font-size: .8rem; color: var(--muted); }
.steps li b { display: block; color: var(--ink); font-size: .86rem; margin-bottom: 2px; }
.steps li.cand { border: 1px dashed var(--cand-line); background: var(--cand-bg); }
.steps li.mine { border-left: 3px solid var(--mine); }

/* 원문 */
.doc { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.2rem; line-height: 1.75; font-size: .9rem; }
.doc p { margin: 0 0 .8rem; white-space: pre-wrap; }
.doc p:last-child { margin-bottom: 0; }
.doc .h { font-weight: 700; font-size: .95rem; }
.doc .dim { color: var(--muted); }
mark { background: var(--mark); color: var(--mark-ink); padding: 1px 3px; border-radius: 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.attach { border-top: 1px solid var(--line); margin-top: 1rem; padding-top: .7rem; font-size: .8rem; line-height: 1.6; }
.attach h4 { margin: 0 0 .4rem; font-size: .72rem; color: var(--soft); font-weight: 600; letter-spacing: .02em; }
.attach dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .3rem .7rem; margin: 0; }
.attach dt { color: var(--soft); font-size: .76rem; }
.attach dd { margin: 0; }
.recmeta { color: var(--soft); font-size: .76rem; margin: -.4rem 0 .7rem; }

/* 구조 — 360 카드 그리드 */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .9rem; }
.asset-card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .9rem 1rem; cursor: pointer;
  transition: border-color .12s; display: flex; flex-direction: column; gap: .5rem; }
.asset-card:hover { border-color: var(--ink); }
.asset-card .top { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
.asset-card h3 { font-size: .92rem; font-weight: 600; line-height: 1.45; margin: 0; }
.asset-card .summary { font-size: .78rem; color: var(--muted); line-height: 1.55; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.asset-card .meta { margin-top: auto; padding-top: .5rem; border-top: 1px solid var(--line); font-size: .72rem;
  color: var(--soft); display: flex; gap: .8rem; flex-wrap: wrap; }
.asset-card .meta a { color: var(--muted); text-decoration: none; cursor: pointer; }
.asset-card .meta a:hover { color: var(--accent); }

/* 구조 — 360 처럼 왼쪽 카드 그리드 + 오른쪽 서랍(#panel, sticky) */
.struct { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 1rem; align-items: start; }
.struct > * { min-width: 0; }
.struct .gallery { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
#panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.1rem; position: sticky; top: .8rem;
  max-height: calc(100vh - 1.6rem); overflow: auto; }
#panel > .empty { border: 0; background: transparent; padding: 0; }
#panel h4 { font-size: 1rem; font-weight: 700; margin: .35rem 0 .4rem; line-height: 1.4; }
#panel .pbody { white-space: pre-wrap; font-size: .86rem; line-height: 1.7; background: var(--paper); border-radius: 6px; padding: .7rem .8rem; margin: .5rem 0 .2rem; }
#panel h5 { font-size: .74rem; color: var(--muted); font-weight: 600; margin: 1rem 0 .35rem; letter-spacing: .02em; }
#panel ul.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; font-size: .8rem; }
#panel ul.plist li { border: 1px solid var(--line); border-radius: 6px; padding: .4rem .55rem; }
#panel ul.plist a { cursor: pointer; }
#panel dl.pf { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .25rem .7rem; margin: .6rem 0 0; font-size: .8rem; }
#panel dl.pf dt { color: var(--soft); }
#panel dl.pf dd { margin: 0; }
#panel .phist { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
#panel .pacts { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .7rem; }
#panel .pstatus { font-size: .8rem; color: var(--muted); margin: .5rem 0 0; }
#panel .pstatus:empty, #panel .perror:empty { margin: 0; }
#panel .perror { font-size: .8rem; color: var(--fail); font-weight: 600; margin: .4rem 0 0; }
.promo { font-size: .78rem; color: var(--muted); margin: .5rem 0 0; }
.promo b { color: var(--ink); }
.proposal { border: 1px dashed var(--cand-line); background: var(--cand-bg); border-radius: 8px; padding: .7rem .8rem; margin: .8rem 0; }
.proposal > b { font-size: .82rem; }
.diff { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .2rem .6rem; font-size: .78rem; margin-top: .4rem; }
.diff dt { color: var(--soft); }
.diff dd { margin: 0; }
.diff del { color: var(--muted); }
.diff ins { text-decoration: none; background: var(--accent-soft); border-radius: 3px; padding: 0 2px; }
.asset-card.on { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
.asset-card.new { border-style: dashed; background: var(--cand-bg); }
.chip.code { color: var(--ink); font-weight: 600; }
.chip.promo-met { border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--accent); background: var(--accent-soft); }
.pills { display: flex; gap: .3rem; flex-wrap: wrap; margin: 0 0 .9rem; }
.pills a { border: 1px solid var(--line); color: var(--muted); font-size: .74rem; padding: .15rem .6rem; border-radius: 999px; text-decoration: none; }
.pills a.on { color: var(--ink); border-color: var(--ink); font-weight: 600; background: var(--card); }
.pills a .n { font-family: var(--mono); font-size: .66rem; margin-left: .25rem; }
@media (max-width: 900px) { .struct { grid-template-columns: minmax(0, 1fr); } #panel { position: static; max-height: none; } }

/* 지도 — 칸반 */
.kanban { display: flex; gap: .9rem; overflow-x: auto; align-items: flex-start; padding-bottom: .4rem; }
.kcol { flex: 1; min-width: 240px; background: color-mix(in srgb, var(--ink) 3.5%, transparent); border-radius: 12px; padding: .75rem .7rem; }
.kcol h2 { font-family: var(--serif); font-size: .98rem; font-weight: 600; margin: 0 .2rem .1rem; }
.kcol h2 .count { font-family: var(--mono); font-size: .72rem; }
.kcol .khint { font-size: .68rem; color: var(--soft); margin: 0 .2rem .6rem; line-height: 1.5; }
.kcard { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: .6rem .7rem; margin-bottom: .5rem; }
.kcard:hover { border-color: var(--ink); }
.kcard.hot { border-left: 3px solid var(--warn); }
.kcard.mine { border-left: 3px solid var(--mine); }
.kcard .kname { font-size: .82rem; font-weight: 600; line-height: 1.45; }
.kcard .kmeta { font-size: .68rem; color: var(--soft); margin-top: .2rem; display: flex; gap: .6rem; flex-wrap: wrap; }
.kcard .kflags { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .35rem; }
.kcard .kflag { font-size: .66rem; border-radius: 4px; padding: .1rem .4rem; color: var(--ai); background: var(--ai-bg); }
.kcard .kflag.memo { color: var(--memo); background: var(--memo-bg); }
.kcard .kacts { display: flex; gap: .3rem; margin-top: .45rem; }
.kcard .kacts button, .kcard .kacts .btn { font-size: .68rem; min-height: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: .2rem .5rem; color: var(--muted); }
.kcard .kacts button:hover, .kcard .kacts .btn:hover { color: var(--accent); border-color: var(--accent); }
.kempty { font-size: .74rem; color: var(--soft); padding: .3rem .2rem; }
/* 결정 버튼 격자 — 판단 검토(React)·대화창 공통. 판단 검토 화면 규칙은 server/ui/src/features/review/Review.module.css(R3) */
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
.acts button { min-height: 40px; font-size: .85rem; }
.later { font-size: .76rem; color: var(--soft); margin: .6rem 0 0; line-height: 1.6; }
.blocked { font-size: .82rem; color: var(--fail); font-weight: 600; margin: .5rem 0 0; }

dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; width: min(760px, calc(100vw - 32px));
  background: var(--card); color: var(--ink); box-shadow: 0 24px 64px rgba(0, 0, 0, .18); }
dialog::backdrop { background: rgba(31, 41, 55, .4); }
dialog .dh { display: flex; justify-content: space-between; align-items: start; gap: .6rem; padding: .9rem 1.2rem; border-bottom: 1px solid var(--line); }
dialog .dh b { font-size: 1rem; }
dialog .db { padding: .9rem 1.2rem; max-height: 72vh; overflow: auto; }
.foot { color: var(--soft); font-size: .72rem; padding: .4rem 1.4rem 2.4rem; }

/* 출처 · 확정 전 재검토 (Q4) */
.chip.src { font-family: inherit; letter-spacing: 0; white-space: normal; overflow-wrap: anywhere; }
.chip.src.none { border-style: dashed; color: var(--soft); }
.recs .srcl { margin-top: .15rem; }
.recheck { font-size: .78rem; line-height: 1.55; color: var(--ink); background: var(--warn-bg); border-radius: 6px; padding: .4rem .6rem; margin: .1rem 0 .35rem; }
.recheck .chip { margin-right: .3rem; }
/* 구조 정의 (Q5) — origin·locked·cardinality 는 서버 판정(/api/state structure)을 그대로 그린다 */
.chip.o-std { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
.chip.o-tpl { color: var(--ai); border-color: color-mix(in srgb, var(--ai) 40%, transparent); background: var(--ai-bg); }
.chip.o-core { color: var(--ink); font-weight: 600; }
.chip.lock { color: var(--mine); border: 1px solid var(--mine); background: var(--mine-bg); font-weight: 600; }
.sdef { display: flex; flex-direction: column; gap: .7rem; }
.sobj { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .8rem .95rem; min-width: 0; }
.sobj.locked { border-left: 3px solid var(--mine); }
.sohead { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; margin-bottom: .35rem; }
.sohead h3 { margin: 0; font-size: 1rem; }
.sohead .tech, .sftbl .tech { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.sftbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: .3rem; }
.sftbl { border-collapse: collapse; width: 100%; font-size: .8rem; }
.sftbl th, .sftbl td { text-align: left; padding: .35rem .45rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.sftbl th { color: var(--muted); font-weight: 600; font-size: .72rem; white-space: nowrap; }
.sftbl td:first-child { min-width: 7rem; }
.srel { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; font-size: .84rem; }
.srel li { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; }
.spv { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .7rem; }
.spvc { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .8rem .95rem; min-width: 0; font-size: .84rem; }
.spvc h4 { margin: 0 0 .35rem; font-size: .95rem; display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
.spvc dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .25rem .6rem; margin: .4rem 0; }
.spvc dt { color: var(--muted); font-size: .76rem; }
.spvc dd { margin: 0; overflow-wrap: anywhere; }
.spvc ul { margin: .2rem 0; padding-left: 1.1rem; }
.spvc .acts { margin-top: .6rem; }
.spvc .pstatus, .spvc .perror, #std-msg { font-size: .8rem; margin: .4rem 0 0; }
.spvc .pstatus:empty, .spvc .perror:empty, #std-msg:empty { margin: 0; }
.spvc .perror { color: var(--fail); font-weight: 600; }
#std-dlg ul { margin: .2rem 0 .6rem; padding-left: 1.1rem; font-size: .86rem; }
#std-dlg h3 { font-size: .8rem; font-weight: 600; color: var(--muted); margin: .8rem 0 .3rem; }
#std-dlg .stdok { display: flex; gap: .5rem; align-items: flex-start; font-size: .88rem; font-weight: 600; margin: .8rem 0; }
#std-dlg .stdok input { margin-top: .25rem; flex: none; }
#std-dlg .acts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sftbl .tech { white-space: nowrap; }
/* 구조 정의 목록/그래프 전환 — 그래프 = 서버 structure_svg.render(structure)(/api/state structure_svg). 배치·판정은 서버, 여기선 넣기만 */
.dmode { display: flex; gap: .3rem; margin: 0 0 .9rem; }
.dmode button { border: 1px solid var(--line); color: var(--muted); background: none; font: inherit; font-size: .74rem; padding: .15rem .7rem; border-radius: 999px; cursor: pointer; }
.dmode button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); font-weight: 600; background: var(--card); }
.dmo { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; overflow-x: auto; }
.dmo svg { display: block; width: 100%; min-width: 420px; height: auto; max-width: 760px; margin: 0 auto; }   /* 좁은 폭은 래퍼(.dmo) 안에서 가로 스크롤 */
.dmo a { text-decoration: none; }
.dmo a:hover circle, .dmo a:focus-visible circle { stroke-width: 3; }
.dmo a:hover line, .dmo a:hover path { stroke-width: 2.4; }
.dlegend { display: flex; flex-wrap: wrap; gap: .25rem .9rem; font-size: .76rem; color: var(--muted); margin: 0 0 .6rem; }
.dlegend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid; vertical-align: -1px; margin-right: .25rem; }
.dlegend .o-core { background: var(--dmo-core-bg); border-color: var(--dmo-core-line); }
.dlegend .o-standard { background: var(--dmo-standard-bg); border-color: var(--dmo-standard-line); }
.dlegend .o-template { background: var(--dmo-template-bg); border-color: var(--dmo-template-line); }
.dlegend .o-custom { background: var(--dmo-custom-bg); border-color: var(--dmo-custom-line); }
[id^="dmo-"] { scroll-margin-top: 1rem; }
.dmo-hit { outline: 2px solid var(--accent); outline-offset: 2px; }
/* DMO 토큰 = structure_svg.tokens_css(dark_attr=True, dark_media=False) 그대로 — 앱 테마 토글(data-theme)을 따르고 OS 는 따르지 않는다. 시험이 같은 문자열을 본다 */
:root{--dmo-ink:#2B2824;--dmo-muted:#6B635A;--dmo-line:#4A443E;--dmo-core-bg:#F6E3EA;--dmo-core-line:#A3406B;--dmo-standard-bg:#DCEBE3;--dmo-standard-line:#186A4B;--dmo-template-bg:#FBEBD8;--dmo-template-line:#B5651D;--dmo-custom-bg:#ECEAE6;--dmo-custom-line:#6B635A}:root[data-theme="dark"]{--dmo-ink:#E7EAE6;--dmo-muted:#A3AAA6;--dmo-line:#BFC6C2;--dmo-core-bg:#3A2230;--dmo-core-line:#E08AB0;--dmo-standard-bg:#1C2E26;--dmo-standard-line:#4FB08A;--dmo-template-bg:#33281C;--dmo-template-line:#E0A262;--dmo-custom-bg:#2A2D2E;--dmo-custom-line:#A3AAA6}
@media (max-width: 700px) { .spv { grid-template-columns: minmax(0, 1fr); } .spvc .acts { position: static; padding: 0; }
  .sftbl { min-width: 560px; } }   /* 좁은 폭은 표만 래퍼 안에서 가로 스크롤 */

@media (max-width: 900px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .rside { position: static; max-height: none; overflow: visible; }
}
@media (max-width: 700px) {
  .wrap { padding: 0 1rem; }
  .mast .wrap { padding-top: .7rem; padding-bottom: .5rem; gap: .3rem .8rem; }
  .mast h1 { font-size: 1.25rem; }
  .acct-menu { right: auto; left: 0; }
  .axiswrap { flex: 1 1 100%; min-width: 100%; }
  nav.tabs .wrap { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  nav.tabs .wrap::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; }
  .tab.maplink { margin-left: 0; }
  html, body { overflow-x: hidden; }
  .paper { padding: 1rem; }
  h2.title { font-size: 1.2rem; }
  .steps { grid-template-columns: 1fr; }
  .doc { padding: .85rem; }
  button, nav.subtabs a { min-height: 36px; }
  button.axpage, button.refresh { min-height: 28px; }
  textarea { font-size: 16px; }
  .acts { position: sticky; bottom: 0; background: var(--card); padding: .6rem 0 .7rem; }
}
/* PR B — 표시 이름 · 「나」 홈 · 오브젝트 · 사람 · 출처 요약/반응 */
.fform { display: flex; flex-direction: column; gap: .35rem; max-width: 600px; }
.fform label, .fform legend, .flabel { font-size: .82rem; font-weight: 600; padding: 0; }
.fform fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: .1rem 1rem; }
.fform fieldset label { font-weight: 500; display: inline-flex; align-items: center; gap: .35rem; min-height: 32px; cursor: pointer; }
.fform fieldset legend { margin-bottom: .1rem; width: 100%; }
.fform input[type="radio"] { accent-color: var(--accent); margin: 0; }
.finput, .fform select, .fform textarea { font: inherit; font-size: .9rem; padding: .45rem .55rem; border: 1px solid var(--line); border-radius: 6px;
  background: var(--card); color: var(--ink); width: 100%; min-width: 0; }
.fform textarea { min-height: 7rem; resize: vertical; }
.fform .hint { margin: 0; }
.frow { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: .3rem; }
.ferr { color: var(--fail); font-weight: 600; font-size: .8rem; margin: .2rem 0 0; }
.ferr:empty, .fok:empty { display: none; }
.fok { color: var(--accent); font-weight: 600; font-size: .82rem; margin: 0 0 .8rem; }
.fok.bad { color: var(--fail); }
.fnote { font-size: .8rem; color: var(--ink); background: var(--warn-bg); border-radius: 6px; padding: .4rem .6rem; margin: 0; }
#leave-dlg .acts { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: .8rem; }
.melinks { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 .4rem; }
.melinks .n { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
.mini { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; font-size: .84rem; }
.mini li { border: 1px solid var(--line); border-radius: 6px; padding: .4rem .6rem; background: var(--card); }
.mini a { color: var(--ink); text-decoration: none; cursor: pointer; }
.mini a:hover { color: var(--accent); }
.mini .tech { display: block; margin-top: .1rem; }
.axl { font-size: .7rem; color: var(--soft); margin: 0 .3rem 0 .4rem; }
.labels .axl { margin: 0; }
.chip.axis { font-family: inherit; letter-spacing: 0; white-space: normal; overflow-wrap: anywhere; color: var(--ink); margin-right: .25rem; }
.labels .chip.axis { margin-right: 0; }
.crumbs { font-size: .78rem; color: var(--muted); margin: 0 0 .5rem; display: flex; gap: .35rem; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
@media (max-width: 700px) {
  .finput, .fform select, .fform textarea { font-size: 16px; }
}
/* board 이전(2026-10-20) — 「나」 활동 집계 · 활동/축 상세 · 연결 장치 · 승인 대기 */
/* PR① 「나」 홈 — 표시 이름 + 왼쪽 「내 데이터」 목록 + 오른쪽 상세. 768px 미만은 목록 → 상세 1열(JS 분기점과 같은 값).
   목록은 넓은 화면에서 sticky(목록만 따로 스크롤), 상세 본문은 페이지 스크롤 — 본문에 세로 스크롤 상자를 두지 않는다 */
/* PR① 마스트(날짜·오늘 띠·질문 레전드) = 옛 화면(#structure·#q·#journal·사용자 탭·대조)에서만. 그 밖의 화면에선 숨긴다 */
body.navnew-screen .mast h1, body.navnew-screen .mast .sub, body.navnew-screen .axiswrap { display: none; }
body.navnew-screen .mast .who { margin-left: auto; }   /* 날짜를 숨겨도 계정 메뉴는 오른쪽 — 펼친 메뉴(right:0)가 화면 왼쪽 밖으로 나가지 않게 */
.hhead { display: flex; align-items: baseline; gap: .8rem; min-width: 0; margin: 0 0 .9rem; }
.hhead h2 { flex: 1 1 auto; font-size: 1.35rem; font-weight: 700; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hhead .fok { margin: 0; }
.home { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 1rem; align-items: start; }
.home > * { min-width: 0; }
.hlist { position: sticky; top: .8rem; max-height: calc(100vh - 1.6rem); overflow: auto; background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: .8rem .7rem; }
.htools { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: 0 .2rem .5rem; }
.htools h3 { font-size: .82rem; font-weight: 600; margin: 0; }
.htools select { font: inherit; font-size: .8rem; min-height: 32px; padding: .2rem .4rem; border: 1px solid var(--line); border-radius: 6px;
  background: var(--card); color: var(--ink); max-width: 13rem; }
ul.hrows { list-style: none; margin: 0; padding: 0; }
ul.hrows li + li { border-top: 1px solid var(--line); }

<script>
"use strict";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const $ = id => document.getElementById(id);
let S = null, loadedAt = "";
// 코어 화면 라벨 — 원작자가 고르는 중(예: 질문 → 「주제」). 한 줄씩 바꾸면 탭·필·칩·서랍·대조 머리말이 같이 바뀐다.
// 사용자 정의 오브젝트(기준·결정·숙제…)의 라벨은 정의 데이터(definitions[].label)가 정본이고, 아래 kind 라벨은 정의가 없을 때만 쓴다.
const LABELS = {
  today: "오늘", question: "질문", record: "기록", structure: "구조", map: "지도",
  candidate: "후보", mine: "내 판단", noQuestion: "질문 없음",
  principle: "기준", event: "결정", collection: "모음", item: "항목",
  aiWording: "AI 문안",
};

// ── 날짜·이름 ─────────────────────────────────────────
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
// 서버 시각은 UTC(ISO, 오프셋 포함) — 보는 사람의 시간대로 바꿔 그린다.
const toDate = iso => { const d = new Date(iso || ""); return isNaN(d) ? null : d; };
const pad2 = n => String(n).padStart(2, "0");
function mdhm(iso) { const d = toDate(iso); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일 ${pad2(d.getHours())}:${pad2(d.getMinutes())}` : ""; }
const ok = part => !S.read || !S.read[part] || S.read[part].ok;

// ── 못 읽음 표시 — 서버의 조치 문장(명령어 포함)은 그리지 않고 코드로 사람 말을 고른다 ──
const WHAT = {
  get "RECORD-MISSING"() { return "글이 지워졌거나 찾을 수 없어요."; },
  "UNAUTHORIZED": "로그인이 풀렸어요.",
  "OFFLINE": "서버에 연결하지 못했어요.",
};
const FIXHINT = "새로 고침해도 그대로면 다시 로그인해 보세요.";
function techInfo(err) {
  if (!err) return "";
  // 내부 번호·명령어는 화면에 내지 않는다 — 지원이 필요하면 진단 파일이 따로 있다.
  const msg = String(err.msg || "");
  return `<details class="tech"><summary>기술 정보</summary><code>${esc(err.code)}</code> ${esc(msg)}</details>`;
}
function partFail(err, what) {
  return `<div class="partfail" role="alert"><b>${esc(what || "이 부분")}을 읽지 못했어요 · 나머지는 정상</b>
    <p>${esc(WHAT[err && err.code] || "읽는 중에 문제가 생겼어요.")} ${esc(FIXHINT)}</p>
    ${techInfo(err)}</div>`;
}

// ── 불러오기 ─────────────────────────────────────────
// 상태 한 벌을 받아 온다. 로그인이 풀렸으면 null(이미 시작 화면 / 으로 보냄). 연결 실패는 throw.
async function fetchState() {
  const r = await fetch("/api/state", {cache: "no-store"});
  if (r.status === 401) { location.href = "/"; return null; }
  return r.json();
}
function applyState(next) {
  S = next;
  loadedAt = mdhm(S.generated);
  render();
  window.dispatchEvent(new Event("crm:state"));   // React 섬 — 새 상태마다 서버 조회를 다시 받는다
}
async function load() {
  let next;
  try {
    next = await fetchState();
    if (!next) return false;
  } catch (e) {
    $("bands").innerHTML = `<div class="band fail" role="alert"><b>서버에 연결하지 못했어요.</b> 잠시 뒤 새로 고침해 주세요.
      ${loadedAt ? `아래 화면은 ${esc(loadedAt)}에 불러온 내용이에요.` : ""}</div>`;
    return false;
  }
  applyState(next);
  return true;
}

// ── 탭 ──────────────────────────────────────────────
// 탭 줄에 없는 옛 화면(질문·기록·구조·지도) — 「자료 종류」·Setup·「나」의 링크(#q·#journal·#structure…)로 열린다.
// blocks 는 옛 기본 탭과 같은 해석 — 질문형은 sheet·candidates·next, 기록형은 journal·next·candidates.
const BASE = {
  q: {id: "q", label: LABELS.question, view: "question", blocks: ["sheet", "candidates", "next"]},
  journal: {id: "journal", label: LABELS.record, view: "record", blocks: ["journal", "next", "candidates"]},
  structure: {id: "structure", label: LABELS.structure, view: "structure", blocks: []},
  map: {id: "map", label: LABELS.map, view: "map", blocks: []},
};
// 탭 줄 = 「나」 · 「오늘」(+ 톱니 Setup). 질문·기록·사용자 정의 탭은 탭 줄에 없고 「자료 종류」 화면에서 들어간다
// (사용자 탭 id·순서·범위는 그대로 — #<탭 id> 링크로 열리고 탭 줄은 Setup 을 켠다).
// 새 화면 id 는 「_」 로 시작한다 — 사용자 탭 id(t-001 꼴)·기본 탭 id(today·q·journal·structure·map·home)와 겹치지 않는다.
// 오늘(#today·#home)·항목 보기(#structure…)는 탭 줄에 없지만 옛 링크로 그대로 열린다(BASE 폴백). #structure/defs 는 내 구조 설정으로.
const NAVTAB = {
  _me: {id: "_me", label: "나", view: "me", blocks: []},
  _obj: {id: "_obj", label: "자료 종류", view: "objects", blocks: []},
  _settings: {id: "_settings", label: "내 구조 설정", view: "settings", blocks: [], settings: true},
  // board 이전 — 탭 줄에 없는 화면(계정 메뉴 「연결 장치」 · 「나」 홈 [승인 대기 N])
  _devices: {id: "_devices", label: "연결 장치", view: "devices", blocks: []},
  _inbox: {id: "_inbox", label: "저장 승인 대기", view: "inbox", blocks: []},
  // PR ①-b 탭 3: 「나」 · 「오늘」 · Setup(B1). 자료 종류·지도·내 구조 설정·연결 장치는 Setup 안으로(옛 링크는 그대로 열린다)
  _today: {id: "_today", label: "오늘", view: "today2", blocks: []},
  _setup: {id: "_setup", label: "설정", view: "setup", blocks: []},
};
const needName = () => !!(S && S.user && "display_name" in S.user && !S.user.display_name);
// 사용자 정의 탭(질문형·기록형) — 탭 줄에 있든 없든 같은 모양
function userTabs() {
  const user = ok("tabs") ? (S.tabs || []) : [];
  return user.map(t => Object.assign({}, t, {blocks: t.blocks || [], view: (t.blocks || [])[0] === "journal" ? "record" : "question"}));
}
const tabsList = () => [NAVTAB._me, NAVTAB._today];
function route() {
  const p = decodeURIComponent(location.hash.slice(1)).split("/");
  return {tab: p[0] || "", a: p[1] || "", b: p[2] || "", c: p[3] || "", d: p[4] || ""};
}
// 탭 줄 탭 → 사용자 정의 탭 ID → 옛 화면(BASE) → 탭 줄에 없는 새 화면(NAVTAB). 모르면 첫 탭.
function pickTab(R, tabs) {
  const id = R.tab;
  return tabs.find(t => t.id === id) || userTabs().find(t => t.id === id) || BASE[id] || NAVTAB[id] || tabs[0];
}
// 탭 줄에 없는 화면이 켤 탭 — 승인 대기 = 「오늘」, 자료 종류·지도·내 구조 설정·연결 장치·항목 보기·질문·기록·사용자 탭 = Setup
const navOn = tab => ({_inbox: "_today", structure: "_setup", _obj: "_setup", _settings: "_setup", _devices: "_setup", map: "_setup"}[tab.id] ||
  (tab.view === "question" || tab.view === "record" ? "_setup" : tab.id));
function tabCount(t) {
  if (t === NAVTAB._today) return S.inbox && typeof S.inbox.pending === "number" ? S.inbox.pending : 0;   // 오늘 = 저장 승인 대기 수
  return 0;
}
const lastView = {};   // 탭마다 마지막으로 본 화면(대조에서 돌아갈 곳)

function render() {
  queueMicrotask(uiSweep);   // 이번 렌더가 다른 화면으로 #view 를 덮었으면(조기 return 포함) 끝난 뒤 React 섬을 내린다
  document.body.classList.remove("navnew-screen");
  if (needName()) {   // 이름 관문(React features/name) — 탭·대화 서랍·띠 없음. 이름을 정하면 다시 그린다. 로그아웃·처리방침·문의 보내기는 그대로
    $("nav-tabs").innerHTML = "";
    uiDrop("chat");
    subnav("");
    $("bands").innerHTML = "";
    $("who").textContent = $("who").title = S.user.email || "";
    acctApply();
    const now = new Date();
    $("date").textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${DOW[now.getDay()]}요일`;
    uiDrop("mast");   // 이름 입력 화면 = 스펙트럼·질문 레전드 없음
    $("foot").textContent = "표시 이름을 정하면 대시보드가 열려요.";
    return uiMount("name");
  }
  const R = route();
  { const to = navReplace(R); if (to) { location.replace(to); return; } }   // 옛 묶음 링크(자료 종류·내 구조 설정·연결 장치·지도·승인 대기·오늘·항목 보기) → 새 자리
  const tabs = tabsList();
  const tab = pickTab(R, tabs);
  const curId = navOn(tab);
  // 새 화면(나·자료 종류·내 구조 설정·연결 장치·저장 승인 대기·지도)은 마스트를 숨긴다 — 머리글 = 화면 제목만
  document.body.classList.toggle("navnew-screen", R.a !== "review" && ["me", "objects", "settings", "devices", "inbox", "map", "today2", "setup"].includes(tab.view));
  $("nav-tabs").innerHTML = tabs.map(t => {
    const on = t.id === curId, n = tabCount(t);
    return `<a href="#${esc(t.id)}" class="tab${on ? " on" : ""}${t.maplink ? " maplink" : ""}"${on ? ' aria-current="page"' : ""}>${esc(t.label)}${n ? `<span class="n">${n}</span>` : ""}</a>`;
  }).join("");
  uiIsland("chat", $("ui-chat"), {reload: load, state: S});   // 대화 서랍(React 상시 섬 — 같은 자리 = 대화 유지). 스위치·장치 상태·이어 받기는 서랍이 본다
  $("who").textContent = S.user && S.user.email ? S.user.email : "";
  $("who").title = S.user && S.user.email ? S.user.email : "";   // 말줄임 — 전체 이메일은 title
  acctApply();
  const now = new Date();   // 머리글 날짜 — 스펙트럼·질문 레전드는 React 상시 섬(#ui-mast)
  $("date").textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${DOW[now.getDay()]}요일`;
  uiIsland("mast", $("ui-mast"), {reload: load, state: S});
  subnav("");
  $("foot").textContent = loadedAt ? `불러온 시각 ${loadedAt}.` : "";
  let b = "";
  if (!ok("meta")) {
    $("bands").innerHTML = b;
    $("view").innerHTML = `<div class="paper">${partFail(S.read.meta.error, "이 데이터 폴더")}</div>`;
    return;
  }
  if (!ok("tabs")) b += `<div class="band fail" role="alert"><b>탭 설정을 읽지 못해 기본 화면을 보여 드려요.</b> 내 탭은 지워지지 않았어요.
      ${esc(WHAT[S.read.tabs.error.code] || "")} ${esc(FIXHINT)}${techInfo(S.read.tabs.error)}</div>`;
  $("bands").innerHTML = b;

  if (R.a === "review") {   // 판단 검토(React) — 돌아갈 곳은 이 라우터가 기억한다(질문형 탭은 그 질문 한 장, 그 외 = 그 탭에서 마지막으로 본 화면)
    const qk = tab.view === "question" && !R.b.startsWith("r:");
    return uiMount("review", [tab.id, R.b, R.c, qk ? `#${tab.id}/${R.b}` : (lastView[tab.id] || `#${tab.id}`), qk ? "질문으로 돌아가기" : `${tab.label}${roJosa(tab.label)} 돌아가기`]);
  }
  lastView[tab.id] = location.hash || "#" + tab.id;
  const sheet = view => uiMount("sheet", [tab.id, view, tab.blocks.join(" "), R.a || ""]);   // 질문·기록 탭(React) — 탭 고르기는 이 라우터
  if (tab.view === "structure") uiMount("structure", [R.a || "", R.b || ""]);   // 구조 항목·판단 문장 + 항목 서랍(React)
  else if (tab.view === "map") uiMount("map", [tab.id]);
  else if (tab.view === "record") sheet("record");
  else if (tab.view === "me") { subnav(""); uiMount("me", [R.a || "", R.b || ""]); }
  else if (tab.view === "today2") uiMount("today", ["today", R.a || "", R.b || ""]);   // 오늘(React) — 대기 하나 = #_today/inbox/<id>
  else if (tab.view === "setup") setupAt = renderSetup(tab, R);
  else if (tab.view === "objects") objMount(R.a, R.b, R.c);
  else if (tab.view === "settings") uiMount("defs");
  else if (tab.view === "devices") uiMount("devices");
  else if (tab.view === "inbox") uiMount("today", ["inbox", R.a || ""]);   // 지난 승인 대기(React — 오늘과 같은 화면 묶음)
  else sheet("question");
  // Setup 안 화면(자료 종류의 상세·옛 항목 보기 포함)엔 Setup 페이지 줄 — 각 화면이 subnav("") 로 비운 뒤 얹는다
  if ((tab.view === "setup" || navOn(tab) === "_setup") && tab.view !== "question") subnav(setupNav(tab.id === "_setup" ? setupAt : "objects"), "설정");
}
let setupAt = "layout";
// 자료 종류(React) — 활동·축 상세는 「활동」 화면, 그 밖(색인·사람·출처·읽고 든 생각)은 「자료 종류」 화면
const objMount = (a, b, c) => a === "activity" || a === "axis" ? uiMount("activity", [a, b || "", c || ""]) : uiMount("objects", [a || "", b || "", c || ""]);
// ── React 섬(R1~R5 다리) — 옮긴 화면(server/ui, 목록 = server/ui/migrated.json)은 #ui-<이름> 자리에 CrmUI.mount 로 띄운다.
// 같은 화면에 다시 오면 자리를 그대로 두고 새 ctx 로 다시 그린다(화면 안 문구·더 받은 쪽 유지). 모듈이 아직이면 자리를 맡겨 두고(main.tsx 가 띄움),
// 빌드가 없으면(<script type="module"> 없음) 한 줄 안내. R5 에서 다리째 지운다.
let uiOn = "";
let uiDirty = null, uiLeaveTo = "";   // 옮긴 화면에서 고치던 글이 있는 주소(ctx.setDirty) — 「저장하지 않은 변경」 대화창·새로 고침 경고
function uiMount(name, args) {
  let el = $("ui-" + name);
  if (!el) { $("view").innerHTML = `<div id="ui-${esc(name)}"></div>`; el = $("ui-" + name); }
  if (uiOn && uiOn !== name) uiDrop(uiOn);   // #view 의 화면은 하나 — 앞 화면(이미 덮였다)을 내린다
  uiOn = name;
  const ctx = {reload: load, state: S, args: args || [], setDirty: at => { uiDirty = at; }, flash: coreFlash, done: coreDone};   // flash = 결과 한 줄 — 그 화면 머리에 한 번
  const how = uiIsland(name, el, ctx);
  if (how) coreFlash = null;
  if (how === "pending") el.innerHTML = LOADING;
  if (!how) el.innerHTML = `<div class="paper"><p class="hint">이 화면 파일이 서버에 없어요. 새로 고침해도 그대로면 운영자에게 알려 주세요.</p></div>`;
}
// 띄우기 공통(#view 화면 · 상시 섬 = 대화 서랍 #ui-chat) — "mounted" · "pending"(모듈보다 먼저 = 이름별로 자리를 맡긴다) · ""(빌드 없음)
function uiIsland(name, el, ctx) {
  if (window.CrmUI) { window.CrmUI.mount(name, el, ctx); return "mounted"; }
  if (!document.querySelector('script[type="module"]')) return "";
  (window.CrmUIPending = window.CrmUIPending || {})[name] = [el, ctx];
  return "pending";
}
function uiDrop(name) {
  if (window.CrmUI) window.CrmUI.unmount(name);
  if (window.CrmUIPending) delete window.CrmUIPending[name];
}
function uiSweep() {
  if (!uiOn || $("ui-" + uiOn)) return;
  uiDrop(uiOn);
  uiOn = "";
}
function subnav(html, label) {
  const n = $("subnav");
  n.innerHTML = html ? `<div class="wrap">${html}</div>` : "";
  n.hidden = !html;
  if (label) n.setAttribute("aria-label", label); else n.removeAttribute("aria-label");
}

// 옛 묶음 주소 replace(navReplace·meTabOfItem)가 읽는 정의·항목 — 화면은 React(구조·내 구조 설정·지도·질문·기록, R5b-1)
const defById = id => (S.definitions || []).find(d => d.id === id);
const itemById = id => (S.items || []).concat(S.item_proposals || []).find(it => it.id === id);

// 「…으로/로 돌아가기」(판단 검토 돌아가기 문구 · 편입 대화창) — 받침 없거나 ㄹ 받침이면 「로」. 판단 검토 화면 = React(server/ui/src/features/review, R3)
function roJosa(w) { const c = String(w).slice(-1).charCodeAt(0) - 0xAC00; return c < 0 || c > 11171 || c % 28 === 0 || c % 28 === 8 ? "로" : "으로"; }

// ── 대화창 섬(React) — 「표시 이름 바꾸기」(#ui-namedlg, 모든 역할 · features/name)·문의(#ui-desk, 관리자 응답엔 자리 없음).
// 열 때마다 새 ctx(args[0] = 어디로) — 그 대화창이 받아 연다. done = 결과 한 줄 + 상태 다시 받기(이름 관문·「나」 머리가 보여 준다)
const dlgCtx = where => ({reload: load, state: S, args: [where], done: coreDone});
const nameDlg = () => uiIsland("namedlg", $("ui-namedlg"), dlgCtx("open"));
const deskDlg = where => { if ($("ui-desk")) uiIsland("desk", $("ui-desk"), dlgCtx(where)); };   // where = send | mine | privacy(features/desk)

// ── 결과 한 줄 — 다음 화면 머리에 한 번(uiMount 가 ctx.flash 로 넘기고 비운다). 쓰기는 각 React 화면이 한다(shared/api·postErr) ──
let coreFlash = null;   // {text, bad}
async function coreDone(text, hash) {
  coreFlash = {text};
  if (hash != null) history.replaceState(null, "", hash);
  await load();
}

// ── 「나」 홈 (PR B) — 표시 이름 · 개수(서버 me.counts) · 최근 목록 · 진입 · 출처별 탭. 성향 문장·자동 요약 없음 ──
// ── 「나」 (R2 2026-11-03) — 화면은 React(server/ui/src/features/me, CrmUI.mount("me")). 여기 남은 것 = 옛 묶음 주소 replace(navReplace)의 meTabOfItem·ME_STD.
// R5b-2b 에서 지운다(일시 중복 — server/ui/migrated.json). Setup 「페이지 레이아웃」은 React(features/me/layout, R5b-2a).
const ME_STD = {principle: "std:principles", decision: "std:decision_events", axis: "std:axes"};   // 기본 종류 = 표준 정의(std_id)
function meTabOfItem(it) {
  const d = it && defById(it.object_id);
  for (const t of ["principle", "decision", "axis"]) if (d && d.std_id === ME_STD[t]) return t;
  return "custom";
}
// ── /「나」 홈 (PR①) ──
// ── Setup (PR ①-b S4) — 탭 「Setup」(사용자·관리자 공통). 페이지 = 페이지 레이아웃 · 내 구조 설정 · 자료 종류 · 연결 장치 · 지도 · 문의 및 개인정보.
// 라우트 #_setup[/<page>]. 기존 화면은 그대로 그리고 위에 Setup 페이지 줄(subnav)만 얹는다. 옛 묶음 주소는 navReplace 가 새 주소로 replace,
// 옛 상세 주소(#_obj/<…>/<id>·#_inbox/<id>·#structure/cand/…)는 그대로 열린다(대상·동작을 다 보존하는 새 화면이 아직 없다).
// 페이지 레이아웃은 React(server/ui/src/features/me/layout — 서버 쓰기는 그 화면이 한다).
const SETUP_PAGES = [["layout", "페이지 레이아웃"], ["structure", "내 구조 설정"], ["objects", "자료 종류"], ["devices", "연결 장치"], ["map", "지도"], ["help", "문의 및 개인정보"], ["migration", "이관"]];
// 옛 묶음 주소 → 새 주소(replace). 없으면 ""
function navReplace(R) {
  if (R.tab === "_obj" && !R.a) return "#_setup/objects";
  if (R.tab === "_settings") return "#_setup/structure";
  if (R.tab === "_devices") return "#_setup/devices";
  if (R.tab === "map" && R.a !== "review") return "#_setup/map";   // 지도의 [대조](#map/review/…)는 판단 검토로
  if (R.tab === "_inbox" && !R.a) return "#_today";
  if (R.tab === "_inbox" && !["pending", "applied", "excluded", "expired", "all"].includes(R.a)) return "#_today/inbox/" + encodeURIComponent(R.a);   // 대기 글 하나 — 같은 상세를 오늘 안에서
  if ((R.tab === "today" || R.tab === "home") && R.a !== "review") return "#_today";   // 옛 오늘 화면은 없다 — 옛 대조 링크(#today/review/…)만 그대로
  // 항목 보기 — 적용된 항목 하나만 「나」 의 그 탭으로. 정의별 카드 그리드(#structure·#structure/<정의>)는 아직 적용 안 된 새 항목 제안(서랍)이
  // 「나」 에 없어 옛 화면 그대로(대상·동작을 다 보존할 때만 대체)
  if (R.tab === "structure") {
    if (R.a === "defs") return "#_setup/structure";
    const it = defById(R.a) && R.b ? itemById(R.b) : null;
    if (it && it.revision) return `#_me/${meTabOfItem(it)}/${encodeURIComponent(R.b)}`;
  }
  return "";
}
// 휴지통 페이지는 스위치 켜짐(trashOn — 휴지통 절)일 때만 줄에 선다. 꺼짐이면 #_setup/trash 는 레이아웃으로 돌린다
const setupPages = () => trashOn() ? SETUP_PAGES.concat([["trash", "휴지통"]]) : SETUP_PAGES;
function setupNav(cur) {
  const admin = S.user && S.user.admin ? `<a href="/admin/setup">운영 관리</a><a href="/admin">운영 콘솔</a>` : "";
  return setupPages().map(([p, l]) => `<a href="#_setup/${p}" class="${p === cur ? "on" : ""}"${p === cur ? ' aria-current="page"' : ""}>${esc(l)}</a>`).join("") + admin;
}
function renderSetup(tab, R) {
  const page = setupPages().some(p => p[0] === R.a) ? R.a : "layout";
  if (R.a && page !== R.a) { location.replace("#_setup/" + page); return; }
  if (page === "layout") uiMount("layout");
  else if (page === "structure") uiMount("defs");   // 내 구조 설정(React)
  else if (page === "objects") objMount(R.b, R.c, R.d);
  else if (page === "devices") uiMount("devices");
  else if (page === "map") uiMount("map", [BASE.map.id]);   // 지도(React)
  else if (page === "trash") uiMount("trash");
  else if (page === "migration") uiMount("migration", [R.b || ""]);   // 이관(React) — plan 하나 = R.b
  else uiMount("help");   // 문의 및 개인정보(React features/desk)
  return page;
}
// ── /Setup ──
// ── 휴지통 (trash PR-1) — 스위치 S.switches.trash 켜짐일 때만: 상세의 [삭제] → 휴지통 · Setup 「휴지통」 페이지([복원]·[영구 삭제]).
// 꺼짐 = 버튼·페이지 0, 기존 동작(사람·생각 즉시 삭제 · 기준 [반영 안 함]·[되돌리기]) 그대로. 휴지통 대상을 일반 화면에서 숨기는 일은 서버 몫(화면은 거르지 않는다).
// 여기 남은 것 = 스위치(Setup 「휴지통」 페이지 줄). 페이지는 React(server/ui/src/features/trash, R1) · 상세 [삭제]는 React 「나」·구조 서랍·활동·자료 종류(shared/item.ts).
const trashOn = () => !!(S && S.switches && S.switches.trash);
// ── /휴지통 ──
// 화면 조각 공통 — 「불러오는 중」 한 줄(uiMount 가 모듈을 기다리는 동안).
const LOADING = `<p class="hint">불러오는 중이에요…</p>`;

// ── 이벤트 ───────────────────────────────────────────
window.addEventListener("beforeunload", e => { if (uiDirty) { e.preventDefault(); e.returnValue = ""; } });   // 새로 고침·닫기 — 옮긴 화면에서 고치던 글
document.addEventListener("click", e => {
  const op = e.target.closest("[data-open]");
  if (op) {
    e.preventDefault();
    if (op.dataset.open === "logout") $("logout").click();
    else deskDlg(op.dataset.open);   // 문의 대화창(관리자 = 자리 없음)
    return;
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open]")) { e.preventDefault(); e.target.click(); }
});
$("dlg-close").onclick = () => $("dlg").close();
// 미저장 보호 — 링크·탭·뒤로 가기 모두 hashchange 로 온다. 옮긴 화면(React)에 고친 글이 있으면 주소를 편집 자리로 되돌리고 묻는다
function uiLeaveGuard() {
  if (!uiDirty || location.hash === uiDirty) return false;
  uiLeaveTo = location.hash;
  history.pushState(null, "", uiDirty);
  if (!$("leave-dlg").open) $("leave-dlg").showModal();
  $("leave-stay").focus();
  return true;
}
$("leave-stay").addEventListener("click", () => { $("leave-dlg").close(); const i = $("hedit-input"); if (i) i.focus(); });
$("leave-go").addEventListener("click", () => { $("leave-dlg").close(); uiDirty = null; const to = uiLeaveTo; uiLeaveTo = ""; location.hash = to || "#_me"; });
window.addEventListener("hashchange", () => { if (uiLeaveGuard()) return; if (S) { render(); window.scrollTo(0, 0); } });   // 1열 목록 위치는 그 화면이 되살린다
$("reload").onclick = () => load();
$("logout").onclick = async () => {
  let to = "/?out=1";
  try { const j = await (await fetch("/logout", {method: "POST"})).json(); if (j && j.ok && j.redirect) to = j.redirect; } catch (e) {}
  location.href = to;
};
// ── 계정 메뉴 (P5) — 문의 대화창 열기(Q1b) · 이름 공유 · 로그아웃(위 핸들러) ──
// 관리자(Q1)는 서버가 사용자 전용 구간(문의·이름 공유 메뉴, 문의 대화창)을 빼고 「운영 콘솔」을 넣어 보낸다 — 요소가 없으면 건너뛴다.
function acctApply() {
  // PR B: 표시 이름 바꾸기(이름 입력 화면에선 숨김). 관리자 응답에도 있다(구간 밖)
  const gate = needName();
  // 이름 입력 전에도 기존 관리자 운영 경로는 톱니 하나에서 열린다. 이름 gate는 그대로다.
  $("setup-link").href = gate && S && S.user && S.user.admin ? "/admin/setup" : "#_setup";
  $("acct-name").hidden = gate || !(S && S.user && "display_name" in S.user);
  // 설정 하위 화면은 오른쪽 위 톱니에서만 연다. 옛 라우트는 유지한다.
  $("acct-settings").hidden = true;
  $("acct-devices").hidden = true;
  // PR① 메뉴 — 저장 승인 대기 (N): N = S.inbox.pending, 0·못 읽음(null)이면 숫자 없음. 이름 공유 동의는 내 구조 설정 화면(namesBox — 숨긴 메뉴 글자를 읽는다)
  $("acct-menu").classList.toggle("navnew", !gate);
  $("acct-inbox").hidden = gate;
  const inN = S && S.inbox && typeof S.inbox.pending === "number" && S.inbox.pending > 0 ? S.inbox.pending : null;
  $("acct-inbox-n").textContent = inN === null ? "" : ` (${inN})`;
  if ($("acct-help-h")) $("acct-help-h").hidden = gate;
}
function acctClose() { $("acct").open = false; }
$("acct-menu").addEventListener("click", async e => {
  const b = e.target.closest("button[data-acct]");
  if (!b || !S) return;
  const act = b.dataset.acct;
  if (act === "logout") return;   // 로그아웃은 $("logout").onclick
  if (act === "name" || act === "settings" || act === "devices" || act === "inbox") {
    acctClose();
    if (act === "name") nameDlg();
    else if (act === "devices") location.hash = "#_devices";
    else if (act === "inbox") location.hash = "#_inbox";
    else location.hash = "#_settings/structure";
    return;
  }
  if (act === "send" || act === "mine" || act === "privacy") {
    acctClose();
    deskDlg(act);
  }
});
document.addEventListener("click", e => { if ($("acct").open && !$("acct").contains(e.target)) acctClose(); });
$("acct").addEventListener("keydown", e => {
  if (e.key === "Escape" && $("acct").open) { acctClose(); $("acct").querySelector("summary").focus(); }
});
// ── /계정 메뉴 ──
load();
</script>
</body>
</html>
