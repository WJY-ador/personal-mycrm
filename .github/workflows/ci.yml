# 검사 게이트. Render 의 "After CI checks pass" 는 특정 체크 이름이 아니라 커밋의 체크 전체를 본다
# (success·neutral·skipped 면 통과). 잡 이름 `test` 는 그대로 둔다.
# 빈 Postgres 에서 돈다 — 신규 스키마 검증이지 운영 DB 업그레이드 검증은 아니다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm
      CRM_DEV: "1"
      CRM_DEV_USER: tester@example.com
      AUTHKIT_ISSUER: https://fake.authkit.test
      CRM_PUBLIC_URL: http://127.0.0.1:8800
      PYTHONUNBUFFERED: "1"

    steps:
      # 24e 옛 코드 호환 시험이 5704546 을 git archive 로 꺼낸다 — 전체 이력이 있어야 한다
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 3.13 고정 — 루트 .python-version 에서 읽는다(Render 도 같은 파일)(매트릭스 없음)
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: server/requirements.txt

      # Render 빌드와 같은 node(server/render.yaml NODE_VERSION) — 바꿀 때 두 곳을 같이
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: server/ui/package-lock.json

      # React 화면 묶음(server/ui, 2026-11-03 R1) — 서버 시험보다 먼저 빌드한다(test_ui_build.py 가 dist/.vite/manifest.json 을 읽는다)
      - name: "UI 의존성 (npm ci)"
        run: npm ci --prefix server/ui

      - name: "UI 빌드 (vite build)"
        run: npm run build --prefix server/ui

      - name: "UI 타입 검사 (tsc --noEmit)"
        run: npm run typecheck --prefix server/ui

      - name: "UI 시험 (vitest — 화면·arch·견본 타입)"
        run: npm test --prefix server/ui

      - name: Install server dependencies
        run: pip install -r server/requirements.txt

      - name: "① Python 문법 (py_compile)"
        run: python -m py_compile server/*.py

      - name: "운영 DB 보호 가드"
        # 허용 목록: 호스트가 localhost·127.0.0.1 일 때만 통과. 값은 출력하지 않는다.
        run: |
          python - <<'PY'
          import os, sys
          from urllib.parse import urlsplit
          host = urlsplit(os.environ.get("DATABASE_URL", "")).hostname
          if host not in ("localhost", "127.0.0.1"):
              print("::error::DATABASE_URL 호스트가 localhost·127.0.0.1 이 아님 — 시험 중단")
              sys.exit(1)
          print("DATABASE_URL 호스트 = 로컬")
          PY

      - name: "③ 스키마 적용 (init_schema)"
        run: python -c "import sys; sys.path.insert(0, 'server'); import db; db.init_schema(); db.close()"

      - name: "④ 서버 시험 (test_tools.py)"
        run: python server/test_tools.py

      # board 이전(2026-10-20) — 웹 화면 경로·이전 CLI 시험. 둘 다 시작 가드가 DB 이름 허용 목록(crm_test*)을 보므로
      # 같은 Postgres 서비스에 전용 DB 를 만들고 그 단계에만 DATABASE_URL 을 덮어쓴다(서버 시험 ④ 는 job env 그대로)
      - name: "④-0 board 이전 시험 DB 만들기"
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:crm@localhost:5432/crm", autocommit=True) as c:
              for name in ("crm_test_web", "crm_test_bi_mig"):
                  c.execute(f"CREATE DATABASE {name}")
          PY

      - name: "④-a 웹 가져오기 화면 시험 (test_web_import.py)"
        env:
          DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm_test_web
        run: python server/test_web_import.py

      # PR①(2026-10-21) — 「나」 홈 시험(/api/records 기록 이어 받기 · 홈 정적). 시작 가드가 crm_test* 를 보므로 전용 DB 를 만들고
      # 이 단계에만 DATABASE_URL 을 덮어쓴다(다른 단계 env 불변)
      - name: "④-d 「나」 홈 시험 DB 만들기"
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:crm@localhost:5432/crm", autocommit=True) as c:
              c.execute("CREATE DATABASE crm_test_web_home")
          PY

      - name: "④-ui UI 표시·탐색 회귀 시험"
        run: python server/test_ui_alignment.py

      - name: "④-d 「나」 홈 시험 (test_web_home.py)"
        env:
          DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm_test_web_home
        run: python server/test_web_home.py

      # 휴지통 PR-1(2026-10-23) — 활동 원천 차단·사람 표식·축 정책·쌓기·운영자 집계·물리 정리. 시작 가드가 crm_test* 를 보므로
      # 전용 DB 를 만들고 이 단계에만 DATABASE_URL 을 덮어쓴다(다른 단계 env 불변)
      - name: "④-e 휴지통 흐름 시험 (test_trash_flow.py)"
        env:
          DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm_test_trash_flow
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:crm@localhost:5432/crm", autocommit=True) as c:
              c.execute("CREATE DATABASE crm_test_trash_flow")
          PY
          python server/test_trash_flow.py

      # 설치 페이지(2026-10-30) — 공개 /download(CRM_DOWNLOAD_PUBLIC 플래그·UA 순서·CSP)·start.html·「연결 장치」 링크.
      # DB 는 쓰지 않지만 시작 가드가 crm_test* 를 보므로 전용 DB 를 만들고 이 단계에만 DATABASE_URL 을 덮어쓴다(다른 단계 env 불변)
      - name: "④-f 설치 페이지 시험 (test_download.py)"
        env:
          DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm_test_download
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:crm@localhost:5432/crm", autocommit=True) as c:
              c.execute("CREATE DATABASE crm_test_download")
          PY
          python server/test_download.py

      # 이전 CLI 시험 가드는 DB 이름을 crm_test_bi_mig 하나로 고정한다(test_migrate_cli.ALLOWED_DBS)
      - name: "④-c board 이전 CLI 시험 (test_migrate_cli.py)"
        env:
          DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm_test_bi_mig
          # reset_db 가 dropdb·createdb 를 부른다 — CI Postgres 는 TCP 만(유닉스 소켓 없음)
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: crm
        run: python server/test_migrate_cli.py

      # 이관 경로(2026-11-02) — 토큰·plan 상태기계·dry-run·반영·영수증·만료·HTTP 경계(합성 PG). 시작 가드가 crm_test* 를 보므로
      # 전용 DB 를 만들고 이 단계에만 DATABASE_URL 을 덮어쓴다(다른 단계 env 불변)
      - name: "④-g 이관 경로 시험 (test_migration_path.py)"
        env:
          DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm_test_migration
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:crm@localhost:5432/crm", autocommit=True) as c:
              c.execute("CREATE DATABASE crm_test_migration")
          PY
          python server/test_migration_path.py

      # 이관 화면(2026-11-02) — 화면이 읽는 응답 키·견본 대조(화면 동작 = React features/migration, Vitest).
      # 시작 가드가 crm_test* 를 보므로 전용 DB 를 만들고 이 단계에만 DATABASE_URL 을 덮어쓴다(다른 단계 env 불변)
      - name: "④-h 이관 화면 시험 (test_migration_screen.py)"
        env:
          DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm_test_migration_screen
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:crm@localhost:5432/crm", autocommit=True) as c:
              c.execute("CREATE DATABASE crm_test_migration_screen")
          PY
          python server/test_migration_screen.py

      # 앱 로그인 넘김(2026-11-02) — /desktop/login · /auth/callback 넘김 · /desktop/claim(PKCE·일회용·2분·state·IP 한도) · 일반 로그인 불변
      # · CRM_DEV 흐름 · 로그에 값 없음(합성 PG). 시작 가드가 crm_test* 를 보므로 전용 DB 를 만들고 이 단계에만 DATABASE_URL 을 덮어쓴다(다른 단계 env 불변)
      - name: "④-i 앱 로그인 넘김 시험 (test_desktop_login.py)"
        env:
          DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm_test_desktop_login
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:crm@localhost:5432/crm", autocommit=True) as c:
              c.execute("CREATE DATABASE crm_test_desktop_login")
          PY
          python server/test_desktop_login.py

      # MCP facade(2026-11-02) — 겉면 5개(find·read·write·decide·purge) · 카탈로그 · 전 op 대칭 · bind · 집계 f:<op>(합성 PG).
      # 시작 가드가 crm_test* 를 보므로 전용 DB 를 만들고 이 단계에만 DATABASE_URL 을 덮어쓴다(다른 단계 env 불변)
      - name: "④-j MCP facade 시험 (test_facade.py)"
        env:
          DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm_test_facade
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:crm@localhost:5432/crm", autocommit=True) as c:
              c.execute("CREATE DATABASE crm_test_facade")
          PY
          python server/test_facade.py

      # PC 연결·토큰 대화 발급(2026-11-02 가안 2) — 설치본·grant 상태기계·앱 세션 수령·자동 연결·교체·M2·해제 기록·이관 scope·facade
      # ·값 없음·cascade(합성 PG). 시작 가드가 crm_test* 를 보므로 전용 DB 를 만들고 이 단계에만 DATABASE_URL 을 덮어쓴다(다른 단계 env 불변)
      - name: "④-k PC 연결 시험 (test_token_grants.py)"
        env:
          DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm_test_token_grants
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:crm@localhost:5432/crm", autocommit=True) as c:
              c.execute("CREATE DATABASE crm_test_token_grants")
          PY
          python server/test_token_grants.py

      # 수기 수정 A0′(2026-11-03) — record_edit(bind·잠금·미결 후보 휴지통)·record_title_set·웹 본문/제목/항목 편집·이력 via·옛 DB 업그레이드.
      # 시작 가드가 crm_test* 를 보므로 전용 DB 를 만들고 이 단계에만 DATABASE_URL 을 덮어쓴다(다른 단계 env 불변)
      - name: "④-l 수기 수정 시험 (test_record_edit.py)"
        env:
          DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm_test_record_edit
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:crm@localhost:5432/crm", autocommit=True) as c:
              c.execute("CREATE DATABASE crm_test_record_edit")
          PY
          python server/test_record_edit.py

      # React 화면 묶음(2026-11-03 R1·R5b-2b) — manifest 허용 목록(지연 불러오기 묶음 포함) 서빙·/app 진입 태그·CSP self·인라인 0·manifest 없음·정적 뼈대.
      # 시작 가드가 crm_test* 를 보므로 전용 DB 를 만들고 이 단계에만 DATABASE_URL 을 덮어쓴다(다른 단계 env 불변)
      - name: "④-m React 화면 묶음 시험 (test_ui_build.py)"
        env:
          DATABASE_URL: postgresql://postgres:crm@localhost:5432/crm_test_ui
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:crm@localhost:5432/crm", autocommit=True) as c:
              c.execute("CREATE DATABASE crm_test_ui")
          PY
          python server/test_ui_build.py

      # board 이전(2026-10-20) — 로컬 에이전트(agent/, 표준 라이브러리만). 서버 DB 를 쓰지 않는다
      - name: "④-b 로컬 에이전트 시험 (agent/tests)"
        run: python -m unittest discover -s agent/tests -t . -v

      - name: "⑤ crm.py check (참고용)"
        continue-on-error: true
        run: python crm.py check

  # 로컬 에이전트는 키트와 같은 Python ≥3.9 약속(manifest requires) — 서버 시험(test, 3.13)과 별도 job.
  # 3.9 는 지원 종료라 ubuntu-latest 매니페스트에서 빠질 수 있어 ubuntu-22.04 에 고정. DB·서비스 없음
  agent-py39:
    name: agent-py39
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: "로컬 에이전트 시험 (Python 3.9)"
        run: python --version && python -m unittest discover -s agent/tests -t . -v
