name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - 'agent/**'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: installer-${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: windows-2022
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      # No Apple certificate: electron-builder must not search the keychain on its own.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # mac signs through desktop/scripts/mac-sign.cjs (ad-hoc unless the release certificate step ran);
      # electron-builder skips signing on pull_request runs unless this is set. pull_request runs get no secrets.
      CSC_FOR_PULL_REQUEST: 'true'
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Read app version
        id: app
        shell: bash
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tag must match app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$APP_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match desktop/package.json version v$APP_VERSION"
            exit 1
          fi
      - name: Install pinned build tools
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Verify staging and checksums
        run: python -m unittest discover -s packaging/tests -v
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Desktop lifecycle and update checks
        working-directory: desktop
        run: npm test
      - name: Build and smoke-test native agent
        run: python packaging/build_agent.py --app-version ${{ steps.app.outputs.version }}
      - name: Import mac release signing certificate
        # The event decides, not whether the secret exists: tag pushes and manual runs sign with the
        # self-signed release certificate (packaging/README.md), pull_request runs stay ad-hoc.
        # An empty secret fails here: an ad-hoc release would break the in-app update chain.
        if: matrix.platform == 'mac' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        id: macsign
        shell: bash
        env:
          MAC_SIGN_P12_BASE64: ${{ secrets.MAC_SIGN_P12_BASE64 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MAC_SIGN_P12_BASE64" ] || [ -z "$MAC_SIGN_P12_PASSWORD" ]; then
            echo "::error::MAC_SIGN_P12_BASE64 and MAC_SIGN_P12_PASSWORD are required to sign a mac release"
            exit 1
          fi
          keychain="$RUNNER_TEMP/mycrm-sign.keychain-db"
          p12="$RUNNER_TEMP/mycrm-sign.p12"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          trap 'rm -f "$p12"' EXIT
          printf '%s' "$MAC_SIGN_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$MAC_SIGN_P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          # Let codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # The certificate is not trusted, so find-identity without -v; it must hold exactly one identity.
          identities=$(security find-identity -p codesigning "$keychain" | awk '$1 ~ /^[0-9]+\)$/ {print $2}' | sort -u)
          if [ "$(printf '%s\n' "$identities" | grep -c .)" != 1 ]; then
            echo "::error::the signing keychain must hold exactly one code signing identity"
            exit 1
          fi
          echo "MYCRM_MAC_SIGN_SHA1=$identities" >> "$GITHUB_ENV"
          echo "MYCRM_MAC_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Create native installer
        working-directory: desktop
        shell: bash
        # The dist script already passes --publish never; passing it twice turns it into a list that
        # electron-builder no longer reads as "never". The update marker goes only on release-signed mac builds.
        run: |
          marker=""
          if [ -n "${MYCRM_MAC_SIGN_SHA1:-}" ]; then marker="-c.extraMetadata.mycrmMacUpdater=true"; fi
          npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }} $marker
      - name: Check update feed, app-update.yml and signing mode
        shell: bash
        run: node desktop/scripts/check-build.cjs release/desktop ${{ matrix.platform }} ${{ matrix.arch }} ${{ steps.app.outputs.version }}
      - name: Remove signing keychain
        if: always() && steps.macsign.outputs.keychain != ''
        shell: bash
        env:
          KEYCHAIN: ${{ steps.macsign.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"
      - name: Verify final installed-bundle sidecar
        run: python packaging/verify_bundle.py
      - name: Install, launch and uninstall on this clean runner
        # Windows: silent per-user NSIS install/uninstall, user data kept. macOS: DMG copy, codesign, 5s launch.
        run: python packaging/install_smoke.py release/desktop
      - name: Scrub owner values from unpacked bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CRM_SCRUB_EXTRA: ${{ secrets.CRM_SCRUB_EXTRA }}
        run: python packaging/scrub_bundle.py release/desktop
      - name: Checksums
        run: python packaging/checksums.py release/desktop
      - name: Upload installers only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MyCRM-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.exe
            release/desktop/*.blockmap
            release/desktop/latest*.yml
            release/desktop/SHA256SUMS.txt

  release:
    name: release-draft
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit must be on main
        run: |
          commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$TAG ($commit) is not on origin/main"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: MyCRM-*-${{ github.sha }}
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install release script dependencies
        # Only js-yaml is needed; skip install scripts so the Electron binary is not downloaded.
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Release names, merged mac feed, checksums
        # desktop/scripts/release-assets.cjs: drop "-<version>" from every build name, merge the arm64 and
        # x64 latest-mac.yml, rewrite the feeds to the release names, then check that every file a feed
        # points to is an asset with the same name, sha512 and size.
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          node desktop/scripts/release-assets.cjs prepare dist upload "$version" "$GITHUB_SHA"
          python3 packaging/checksums.py upload
          node desktop/scripts/release-assets.cjs check upload "$version"
          cat upload/SHA256SUMS.txt
      - name: Create draft release
        run: |
          mapfile -t assets < <(node desktop/scripts/release-assets.cjs names)
          gh release create "$TAG" --draft --verify-tag \
            --title "MyCRM $TAG (베타)" --notes-file packaging/release-notes.md \
            "${assets[@]/#/upload/}"
      - name: Draft must carry exactly the release assets
        run: |
          expected=$(node desktop/scripts/release-assets.cjs names | sort)
          # Read the draft from the release list; tag lookups may not return drafts.
          actual=$(gh api "repos/$GH_REPO/releases?per_page=30" --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .assets[].name" | sort)
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::draft assets differ from desktop/scripts/release-assets.cjs names"
            echo "$actual"
            exit 1
          fi
