name: Desktop installers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - 'agent/**'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: installer-${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: windows-2022
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      # Until distribution certificates are configured, these are unsigned beta artifacts.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned build tools
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Verify staging and checksums
        run: python -m unittest discover -s packaging/tests -v
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Desktop lifecycle and update checks
        working-directory: desktop
        run: npm test
      - name: Build and smoke-test native agent
        run: python packaging/build_agent.py --app-version 0.1.1
      - name: Create native installer
        working-directory: desktop
        run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify final installed-bundle sidecar
        run: python packaging/verify_bundle.py
      - name: Checksums
        run: python packaging/checksums.py release/desktop
      - name: Upload installers only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MyCRM-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/desktop/*.dmg
            release/desktop/*.exe
            release/desktop/*.blockmap
            release/desktop/*.yml
            release/desktop/SHA256SUMS.txt
